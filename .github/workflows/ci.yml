name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-syntax:
    name: Syntax & Lint Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Shell Syntax
        run: |
          for sh_file in scripts/*.sh hooks/theme-set.d/* zedconf/*.sh tests/*.sh; do
            [ -f "$sh_file" ] || continue
            bash -n "$sh_file"
          done

      - name: Run Idempotency & Safety Check
        run: bash tests/test_idempotency_safety.sh

      - name: Run Syntax & Integrity Test Suite
        run: bash tests/test_syntax_integrity.sh

  test-suites:
    name: Comprehensive Test Suites
    runs-on: ubuntu-latest
    needs: lint-and-syntax
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Full Test Suite
        run: bash tests/run-all.sh
